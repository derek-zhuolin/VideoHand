<!--
  Handdrawn caption skin — 手绘涂鸦片的字幕皮肤。
  纸感半透明卡片 + 手写字体（Caveat/Ma Shan Zheng）+ 暖橙马克笔逐词高亮。
  契约与引擎一致：.caption-group / .caption-word + .is-active / .is-spoken，
  状态用 gsap.set({className}) 驱动（seek-safe），root data-composition-id="captions"。
-->
<script src="assets/vendor/gsap.min.js"></script>

<!-- captions.mjs injects the project's :root tokens here -->
<style data-brand-tokens></style>

<style>
  @font-face {
    font-family: "Caveat";
    src: url("assets/fonts/Caveat-700-latin.woff2") format("woff2");
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: "Ma Shan Zheng";
    src: url("assets/fonts/MaShanZheng-subset.woff2") format("woff2");
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: "PingFang SC";
    src: local("PingFang SC");
  }

  /* :root#captions-root 特异性必须高于引擎默认 :root 才能覆盖 band-top */
  :root#captions-root {
    --cap-ink: #003e1f; /* 深绿墨线 */
    --cap-canvas: #fffffc; /* 纸面 */
    --cap-accent: #53a548; /* 马克笔绿 —— 只做描边，不做底色（2.75:1 挂 check） */
    --cap-accent-ink: #3c7a33; /* 要绿色文字走这个（5.2:1） */
    --cap-band-top: 886px;
    --cap-band-height: 170px;
  }
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 886px);
    height: var(--cap-band-height, 170px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* 纸感卡片：米白半透明 + 细发丝边 + 轻倾斜，像贴在纸上的便签 */
  .caption-pill {
    position: relative;
    max-width: 78%;
    padding: 12px 40px 18px;
    background: rgba(255, 255, 252, 0.74);
    backdrop-filter: blur(10px) saturate(1.15);
    -webkit-backdrop-filter: blur(10px) saturate(1.15);
    border: 1.5px solid rgba(0, 62, 31, 0.24);
    border-radius: 12px;
    transform: rotate(-0.5deg);
    box-shadow: 0 6px 22px rgba(0, 62, 31, 0.1);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.08em 0.26em;
    font-family: "Ma Shan Zheng", "PingFang SC", sans-serif;
    font-weight: 400;
    font-size: clamp(42px, 4.2vw, 58px);
    line-height: 1.08;
    letter-spacing: 0.02em;
  }

  /* 未说到：淡墨（4.78:1，纸面上可读） */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    color: rgba(0, 62, 31, 0.68);
  }
  /* 当前词：马克笔涂抹块。
     底色必须是深绿 --cap-ink（纸色字 12.3:1），不能用 --cap-accent 打底
     —— 绿底纸字只有 2.75:1，check 直接挂。accent 只留在块的描边上。 */
  .caption-word.is-active {
    color: var(--cap-canvas, #fffffc);
    background: var(--cap-ink, #003e1f);
    border-radius: 4px;
    box-shadow: 0 0 0 0.05em var(--cap-accent, #53a548);
  }
  /* 已说过：深墨 */
  .caption-word.is-spoken {
    color: var(--cap-ink, #003e1f);
    background: transparent;
    box-shadow: none;
  }

  /* 品牌词（DeepSeek/Harness/Claude/Code/npm 等英文）走 Caveat 手写 */
  .caption-word.cap-brand {
    font-family: "Caveat", "Ma Shan Zheng", cursive;
  }
  .caption-word.cap-num {
    font-family: "Caveat", monospace;
  }
  /* CTA 词：文字用派生的深绿（5.2:1），下划线才用 accent —— 绿当字色只有 2.75:1 */
  .caption-word.cap-cta {
    color: var(--cap-accent-ink, #3c7a33);
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: var(--cap-accent, #53a548);
    text-underline-offset: 0.08em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(36px, 5.2vw, 50px);
    }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="0"
  data-fps="30"
  data-width="0"
  data-height="0"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [];
  var DURATION = 0;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        if (w.cls) span.classList.add(w.cls);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.985 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
