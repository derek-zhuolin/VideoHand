name: VideoHand Director and Doodle CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm pack --dry-run
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm install -g hyperframes@0.8.77
      - run: npm test
      - run: node bin/videohand.mjs create --config examples/doodle/project.json --out ../doodle-smoke
      - run: hyperframes check ../doodle-smoke/landscape --snapshots --json
      - run: hyperframes check ../doodle-smoke/portrait --snapshots --json
      - run: hyperframes render ../doodle-smoke/landscape --output ../doodle-landscape.mp4 --fps 30 --quality high --workers 1
      - run: hyperframes render ../doodle-smoke/portrait --output ../doodle-portrait.mp4 --fps 30 --quality high --workers 1
      - run: node bin/videohand.mjs compose --plan examples/director/capacity-handoff.json --out ../director-smoke
      - run: hyperframes check ../director-smoke/landscape --snapshots --json
      - run: hyperframes check ../director-smoke/portrait --snapshots --json
      - run: hyperframes render ../director-smoke/landscape --output ../director-landscape.mp4 --workers 1
      - run: node bin/videohand.mjs compose --plan examples/director/framed-presenter.json --out ../framed-smoke
      - run: hyperframes check ../framed-smoke/landscape --snapshots --json
      - run: hyperframes check ../framed-smoke/portrait --snapshots --json
      - run: node examples/motion-study/build.mjs --out ../motion-study-smoke
      - run: hyperframes check ../motion-study-smoke --snapshots --json
      - run: hyperframes render ../motion-study-smoke --output ../motion-study.mp4 --workers 1
      - run: node examples/icon-first/build.mjs --out ../icon-first-smoke
      - run: hyperframes check ../icon-first-smoke --snapshots --json
      - run: hyperframes render ../icon-first-smoke --output ../icon-first-study.mp4 --workers 1
